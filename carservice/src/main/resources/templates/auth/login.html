<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login – CarService</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-logo">
            <h1>🔧 CarService</h1>
            <p>Car Maintenance & Service Management</p>
        </div>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

        <form th:action="@{/auth/login}" method="post">
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" name="email" class="form-control" placeholder="you@email.com" required>
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center; padding:0.75rem;">
                Sign In
            </button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a th:href="@{/auth/register}">Register here</a>
        </div>

        <div style="margin-top:1.5rem; padding-top:1rem; border-top:1px solid var(--border); font-size:0.8rem; color:var(--text-muted); text-align:center;">
            Admin login: admin@carservice.com / admin123
        </div>
    </div>
</div>
</body>
</html>
