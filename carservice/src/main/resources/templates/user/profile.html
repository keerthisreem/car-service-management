<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Profile – CarService</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar">
    <a class="navbar-brand" th:href="@{/user/dashboard}">🔧 <span>CarService</span></a>
    <div class="nav-links">
        <span style="color:var(--text-muted); font-size:0.85rem; margin-right:0.5rem;">
            👤 <span th:text="${user.name}"></span>
        </span>
        <a href="/auth/logout" class="btn btn-outline btn-sm nav-logout">Logout</a>
    </div>
</nav>

<div class="layout">
    <aside class="sidebar">
        <div class="sidebar-section">
            <div class="sidebar-label">Menu</div>
            <a th:href="@{/user/dashboard}">🏠 Dashboard</a>
            <a th:href="@{/user/vehicles}">🚗 My Vehicles</a>
            <a th:href="@{/user/appointments}">📅 Appointments</a>
            <a th:href="@{/user/services}">⚙️ Services</a>
            <a th:href="@{/user/profile}" class="active">👤 My Profile</a>
        </div>
    </aside>

    <main class="main">
        <div class="page-header">
            <div>
                <div class="page-title">My Profile</div>
                <div class="page-subtitle">View and update your account details</div>
            </div>
        </div>

        <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:1.5rem; max-width:800px;">

            <!-- Profile Card -->
            <div class="card" style="grid-column:1/-1; display:flex; align-items:center; gap:1.5rem; padding:2rem;">
                <div style="width:72px; height:72px; border-radius:50%; background:rgba(232,133,74,0.15);
                            display:flex; align-items:center; justify-content:center;
                            font-size:2rem; flex-shrink:0;">👤</div>
                <div>
                    <div style="font-size:1.4rem; font-weight:800; font-family:'Syne',sans-serif;"
                         th:text="${user.name}"></div>
                    <div style="color:var(--text-muted); font-size:0.9rem;" th:text="${user.email}"></div>
                    <div style="margin-top:0.5rem;">
                        <span class="badge badge-approved" th:text="${user.role}"></span>
                    </div>
                </div>
            </div>

            <!-- Account Info -->
            <div class="card">
                <div class="card-title mb-2">Account Information</div>
                <div style="display:flex; flex-direction:column; gap:1rem;">
                    <div>
                        <div class="form-label">Full Name</div>
                        <div style="font-weight:600;" th:text="${user.name}"></div>
                    </div>
                    <div>
                        <div class="form-label">Email Address</div>
                        <div style="font-weight:600;" th:text="${user.email}"></div>
                    </div>
                    <div>
                        <div class="form-label">Phone Number</div>
                        <div style="font-weight:600;"
                             th:text="${user.phone != null ? user.phone : 'Not provided'}"></div>
                    </div>
                    <div>
                        <div class="form-label">Account Type</div>
                        <div style="font-weight:600;" th:text="${user.role}"></div>
                    </div>
                </div>
            </div>

            <!-- Edit Profile -->
            <div class="card">
                <div class="card-title mb-2">Edit Profile</div>
                <form th:action="@{/user/profile/update}" method="post">
                    <div class="form-group">
                        <label class="form-label">Full Name</label>
                        <input type="text" name="name" class="form-control"
                               th:value="${user.name}" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Phone Number</label>
                        <input type="text" name="phone" class="form-control"
                               th:value="${user.phone}" placeholder="10-digit number">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Email Address</label>
                        <input type="email" class="form-control"
                               th:value="${user.email}" disabled
                               style="opacity:0.5; cursor:not-allowed;">
                        <div style="font-size:0.75rem; color:var(--text-muted); margin-top:4px;">
                            Email cannot be changed
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </form>
            </div>

        </div>
    </main>
</div>
</body>
</html>
